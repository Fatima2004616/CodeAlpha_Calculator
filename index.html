
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <header class="header">
      <div>
        <p class="eyebrow">SMART TOOLS</p>
        <h1>Calculator</h1>
      </div>
      <div class="calculator-icon">÷</div>
    </header>

    <section class="display" aria-label="Calculator display" aria-live="polite">
      <div id="expression" class="expression">Ready to calculate</div>
      <output id="result" class="result">0</output>
    </section>

    <section class="keys" aria-label="Calculator buttons">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="delete" aria-label="Delete last character">DEL</button>
      <button class="key operator" data-operator="÷">÷</button>
      <button class="key operator" data-operator="×">×</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key operator" data-operator="−">−</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key equals" data-action="equals">=</button>

      <button class="key utility" data-action="sign">+/−</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key utility" data-action="percent">%</button>
    </section>

    <footer>Built with HTML · CSS · JavaScript</footer>
  </main>
</body>
</html>
